name: Selenium TestNG Automation

on:
  push:
    branches: [ "main" ]        # Runs every time you push to main
  pull_request:
    branches: [ "main" ]        # Runs for pull requests
  workflow_dispatch:             # Allows manual run from GitHub UI
  schedule:
    - cron: '0 9 * * *'          # (Optional) runs daily at 9 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your Selenium repo code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java (for TestNG + Selenium)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Install Chrome for Selenium
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # 4️⃣ Cache Maven dependencies (optional but faster)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 5️⃣ Run Selenium + TestNG tests
      - name: Run Selenium Tests
        run: mvn clean test -Dfrontend.url=https://full-stack-blog-project-zeta.vercel.app/

      # 6️⃣ Upload TestNG reports as artifact (optional but useful)
      - name: Upload TestNG Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report
          path: target/surefire-reports/
